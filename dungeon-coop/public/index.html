<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07050c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>深淵獵團</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- ======== 遊戲中 HUD（全部用彈性容器＋安全區域錨定） ======== -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div id="party" class="party"></div>
    <div id="stage" class="stage"></div>
    <div class="hud-right">
      <div id="roomTag" class="chip"></div>
      <button id="btnMenu" class="icon-btn" aria-label="選單">☰</button>
    </div>
  </div>
  <div id="banners" class="banners"></div>
  <div id="center" class="center-msg"></div>
  <div class="hud-bottom">
    <div id="hint" class="hint"></div>
    <div id="bossBars" class="boss-bars"></div>
    <div id="actionBar" class="action-bar"></div>
  </div>
  <div id="rotateHint" class="rotate-hint hidden" role="status">
    <span>📱↻ 轉成橫向螢幕，視野更大、操作更順手</span>
    <button id="btnLandscape" class="gold">切換橫向全螢幕</button>
    <button id="btnRotateClose" class="link" aria-label="關閉">✕</button>
  </div>
  <!-- 手機觸控：左下動態搖桿、右下扇形按鈕 -->
  <div id="touch" class="touch">
    <div id="stickZone" class="stick-zone"></div>
    <div id="stick" class="stick hidden"><div id="knob" class="knob"></div></div>
    <div id="fan" class="fan"></div>
  </div>
</div>

<!-- ======== 彈窗 ======== -->
<div id="choiceModal" class="modal hidden" role="dialog" aria-label="選擇增幅">
  <div class="modal-box wide">
    <h2 id="choiceTitle">選擇一個增幅</h2>
    <div id="choiceCards" class="cards"></div>
    <div class="row center"><button id="btnReroll" class="alt">重擲</button></div>
    <p class="note center pc-only">按 1／2／3 或點擊卡片選擇，R 重擲</p>
  </div>
</div>
<div id="skinModal" class="modal hidden" role="dialog" aria-label="鏡像衣櫃">
  <div class="modal-box">
    <h2>鏡像衣櫃</h2>
    <p class="note" id="skinNote"></p>
    <div id="skinList" class="skin-grid"></div>
    <div class="row center"><button class="alt" data-close>關閉</button></div>
  </div>
</div>
<div id="menuModal" class="modal hidden" role="dialog" aria-label="選單">
  <div class="modal-box">
    <h2>選單</h2>
    <div class="stack" id="menuBody"></div>
  </div>
</div>
<div id="resultModal" class="modal hidden" role="dialog">
  <div class="modal-box">
    <h2 id="resultTitle"></h2>
    <div id="resultBody" class="stack"></div>
    <p class="note center">即將回到冥界聖殿…</p>
  </div>
</div>

<!-- ======== 選單畫面 ======== -->
<div id="screens">
  <section id="authScreen" class="panel hidden">
    <canvas id="title" class="title-art" aria-label="深淵獵團 主視覺"></canvas>
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="login">登入</button>
      <button class="tab" data-tab="register">註冊</button>
    </div>
    <form id="authForm" class="stack" autocomplete="on">
      <label>帳號<input name="username" autocomplete="username" maxlength="16" placeholder="3～16 個英文字母或數字"></label>
      <label>密碼<input name="password" type="password" autocomplete="current-password" maxlength="64" placeholder="至少 6 個字元"></label>
      <label class="reg-only hidden">暱稱（顯示在頭頂）<input name="nick" maxlength="10" placeholder="最多 10 個字"></label>
      <button type="submit" id="authSubmit">登入</button>
      <div class="divider">或</div>
      <button type="button" id="btnGuest" class="gold">遊客快速遊玩（之後可綁定帳號）</button>
      <div class="err" id="authErr"></div>
    </form>
  </section>

  <section id="homeScreen" class="panel hidden">
    <canvas id="title2" class="title-art small"></canvas>
    <div class="profile">
      <div class="profile-main">
        <div class="nick-row"><span id="homeNick" class="nick"></span><button id="btnNick" class="link">改暱稱</button></div>
        <div class="note" id="homeAcct"></div>
      </div>
      <div class="crys-box"><span>魂晶</span><b id="homeCrys" class="crys">0</b></div>
    </div>
    <div class="stats" id="homeStats"></div>
    <div class="stack">
      <button id="btnCreate">建立房間</button>
      <div class="join-row">
        <input id="joinCode" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4 位數房號" aria-label="房間號碼">
        <button id="btnJoin" class="alt">加入</button>
      </div>
      <div class="grid2">
        <button id="btnCamp" class="alt">營地：天賦與造型</button>
        <button id="btnSettings" class="alt">設定</button>
      </div>
      <button id="btnBind" class="gold hidden">綁定帳號（保留遊客進度）</button>
      <button id="btnLogout" class="link">登出</button>
      <div class="err" id="homeErr"></div>
    </div>
  </section>

  <section id="campScreen" class="panel wide hidden">
    <div class="camphead">
      <h2>營地</h2>
      <div class="row"><span>魂晶 <b class="crys" id="campCrystals">0</b></span><button class="alt" data-back>返回</button></div>
    </div>
    <div class="tabs" id="campTabs"></div>
    <div class="campgrid">
      <div><h3>科技樹</h3><div id="tree" class="tree"></div></div>
      <div><h3>升級說明</h3><div id="nodeDetail" class="detail"></div><h3>造型</h3><div id="campSkins" class="skin-grid"></div></div>
    </div>
    <div class="err" id="campErr"></div>
  </section>

  <section id="settingsScreen" class="panel hidden">
    <h2>設定</h2>
    <div class="stack" id="settingsBody"></div>
    <button class="alt" data-back>返回</button>
  </section>

  <section id="bindScreen" class="panel hidden">
    <h2>綁定帳號</h2>
    <p class="note">設定帳號密碼後，遊客的魂晶、造型與紀錄都會保留，之後可以在任何裝置登入。</p>
    <form id="bindForm" class="stack">
      <label>帳號<input name="username" autocomplete="username" maxlength="16"></label>
      <label>密碼<input name="password" type="password" autocomplete="new-password" maxlength="64"></label>
      <button type="submit">綁定</button>
      <button type="button" class="alt" data-back>返回</button>
      <div class="err" id="bindErr"></div>
    </form>
  </section>
</div>
<div id="toast" class="toast"></div>
<script src="config.js"></script>
<script type="module" src="client.js"></script>
</body>
</html>
