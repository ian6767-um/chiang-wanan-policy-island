<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c1418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="澎湖慢釣：帶著橘貓小卷，開小船在澎湖群島慢慢釣魚的療癒放置遊戲。">
  <title>澎湖慢釣</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preload" href="assets/fonts/Cubic_11.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="view" width="640" height="360"></canvas>
    <div id="ui"></div>
  </div>
  <div id="rotate" hidden>
    <canvas id="rotate-art" width="64" height="48"></canvas>
    <p>請將手機轉為橫向</p>
    <p class="sub">遊戲已暫停，轉回橫向後會自動繼續</p>
  </div>
  <div id="boot">載入中…</div>
  <noscript>這個遊戲需要啟用 JavaScript。</noscript>
  <script type="module" src="src/game/main.js"></script>
</body>
</html>
